# Video gateway + optional GPU worker.
# Railway / CPU hosts should run ONLY the gateway service.
# Attach a CUDA machine as `worker` — never pretend the gateway has a GPU.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      # Require explicit secrets — no changeme defaults (fail closed).
      API_KEY: ${API_KEY:?Set API_KEY — run: python scripts/generate_gateway_api_key.py}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN — run: python scripts/generate_gateway_api_key.py --label WORKER_TOKEN}
      AUTH_MODE: ${AUTH_MODE:-required}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED:-false}
      VIDEO_WORKER_URL: ${VIDEO_WORKER_URL:-http://worker:8090}
      DATABASE_URL: sqlite:////data/video_gateway.db
      STORAGE_PATH: /data
      DEFAULT_ENGINE: ${DEFAULT_ENGINE:-auto}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPUTE_COST_PER_GPU_HOUR_USD: ${COMPUTE_COST_PER_GPU_HOUR_USD:-0.50}
    volumes:
      - video_data:/data
    depends_on:
      - worker
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN — run: python scripts/generate_gateway_api_key.py --label WORKER_TOKEN}
      MODEL_CACHE: /models
      HF_HOME: /models/hf
      HF_TOKEN: ${HF_TOKEN:-}
      STORAGE_PATH: /data
      DEFAULT_ENGINE: ${DEFAULT_ENGINE:-auto}
      MAX_VRAM_PERCENT: ${MAX_VRAM_PERCENT:-90}
      ALLOW_MOCK_INFERENCE: "false"
      WAN_REPO: /opt/third_party/Wan2.2
      LTX_REPO: /opt/third_party/LTX-Video
      FRAMEPACK_REPO: /opt/third_party/FramePack
    volumes:
      - model_cache:/models
      - video_data:/data
      - ./third_party:/opt/third_party
    # Uncomment on NVIDIA hosts with nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    expose:
      - "8090"
    restart: unless-stopped

volumes:
  video_data:
  model_cache:
