[project]
name = "earner"
version = "0.1.0"
description = "AI agents firm platform + open-model video generation gateway for Instagram/YouTube."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "cryptography>=44",
]

[project.optional-dependencies]
stripe = ["stripe>=12"]
dev = ["pytest>=8", "httpx>=0.27"]
video = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "numpy>=1.26",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "huggingface_hub>=0.25",
]
# Live trading only. The engine, the risk limits, the simulator and every test
# run on the standard library alone — this is needed solely to talk to Kotak.
kotak = [
    "neo_api_client @ git+https://github.com/Kotak-Neo/Kotak-neo-api-v2.git@v2.0.2",
]

[project.scripts]
earner = "earner.cli:main"
video-gateway = "gateway.main:app"
video-mcp = "mcp_server.server:run_stdio_mcp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earner*", "gateway*", "worker*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
