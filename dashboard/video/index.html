<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>Lumen — AI Video Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/dashboard/assets/styles/base.css" />
  <link rel="stylesheet" href="/dashboard/assets/styles/shell.css" />
  <link rel="stylesheet" href="/dashboard/assets/styles/components.css" />
  <link rel="stylesheet" href="/dashboard/assets/styles/pages.css" />
  <link rel="stylesheet" href="/dashboard/assets/styles/motion.css" />
</head>
<body>
  <a class="ls-skip" href="#ls-main">Skip to content</a>
  <div class="ls-atmosphere" aria-hidden="true">
    <div class="ls-atmosphere__glow ls-atmosphere__glow--a"></div>
    <div class="ls-atmosphere__glow ls-atmosphere__glow--b"></div>
    <div class="ls-atmosphere__grain"></div>
  </div>

  <div id="ls-app" class="ls-app" data-sidebar="expanded">
    <aside class="ls-sidebar" id="ls-sidebar" aria-label="Primary">
      <div class="ls-sidebar__brand">
        <button type="button" class="ls-brand" data-nav="home" aria-label="Lumen home">
          <span class="ls-brand__mark" aria-hidden="true">L</span>
          <span class="ls-brand__text">
            <span class="ls-brand__name">Lumen</span>
            <span class="ls-brand__sub">AI Video Studio</span>
          </span>
        </button>
        <button type="button" class="ls-icon-btn ls-sidebar__collapse" id="ls-sidebar-toggle" aria-expanded="true" aria-controls="ls-sidebar" title="Collapse sidebar">
          <span class="ls-icon" aria-hidden="true"></span>
        </button>
      </div>

      <nav class="ls-nav" aria-label="Studio">
        <div class="ls-nav__group" data-group="main">
          <button type="button" class="ls-nav__item" data-nav="home"><span class="ls-nav__icon" data-icon="home"></span><span class="ls-nav__label">Home</span></button>
          <button type="button" class="ls-nav__item" data-nav="create"><span class="ls-nav__icon" data-icon="create"></span><span class="ls-nav__label">Create</span></button>
          <button type="button" class="ls-nav__item" data-nav="image-video"><span class="ls-nav__icon" data-icon="image"></span><span class="ls-nav__label">Image → Video</span></button>
          <button type="button" class="ls-nav__item" data-nav="text-video"><span class="ls-nav__icon" data-icon="text"></span><span class="ls-nav__label">Text → Video</span></button>
          <button type="button" class="ls-nav__item" data-nav="projects"><span class="ls-nav__icon" data-icon="projects"></span><span class="ls-nav__label">Projects</span></button>
          <button type="button" class="ls-nav__item" data-nav="assets"><span class="ls-nav__icon" data-icon="assets"></span><span class="ls-nav__label">Assets</span></button>
          <button type="button" class="ls-nav__item" data-nav="queue"><span class="ls-nav__icon" data-icon="queue"></span><span class="ls-nav__label">Generation Queue</span><span class="ls-nav__badge" id="ls-queue-badge" hidden>0</span></button>
          <button type="button" class="ls-nav__item" data-nav="models"><span class="ls-nav__icon" data-icon="models"></span><span class="ls-nav__label">Models</span></button>
          <button type="button" class="ls-nav__item" data-nav="analytics"><span class="ls-nav__icon" data-icon="analytics"></span><span class="ls-nav__label">Analytics</span></button>
          <button type="button" class="ls-nav__item" data-nav="system"><span class="ls-nav__icon" data-icon="system"></span><span class="ls-nav__label">System</span></button>
        </div>
        <div class="ls-nav__group ls-nav__group--bottom" data-group="account">
          <button type="button" class="ls-nav__item" data-nav="settings"><span class="ls-nav__icon" data-icon="settings"></span><span class="ls-nav__label">Settings</span></button>
          <button type="button" class="ls-nav__item" data-nav="api"><span class="ls-nav__icon" data-icon="api"></span><span class="ls-nav__label">API</span></button>
          <button type="button" class="ls-nav__item" data-nav="account"><span class="ls-nav__icon" data-icon="account"></span><span class="ls-nav__label">Account</span></button>
        </div>
      </nav>

      <div class="ls-sidebar__status" id="ls-sidebar-status" aria-live="polite">
        <span class="ls-status-dot" data-state="unknown"></span>
        <span class="ls-sidebar__status-text">Checking…</span>
      </div>
    </aside>

    <div class="ls-workspace">
      <header class="ls-topbar">
        <button type="button" class="ls-icon-btn ls-topbar__menu" id="ls-mobile-menu" aria-label="Open navigation">
          <span class="ls-icon ls-icon--menu" aria-hidden="true"></span>
        </button>
        <div class="ls-topbar__title">
          <h1 id="ls-page-title">Home</h1>
          <p id="ls-page-sub" class="ls-topbar__sub">Create → Generate → Watch → Manage</p>
        </div>
        <div class="ls-topbar__actions">
          <button type="button" class="ls-btn ls-btn--ghost" id="ls-cmd-open" aria-keyshortcuts="Meta+K Control+K">
            <span class="ls-kbd">⌘K</span>
            <span>Commands</span>
          </button>
          <button type="button" class="ls-btn ls-btn--primary ls-btn--magnetic" data-nav="create" id="ls-top-create">
            New generation
          </button>
        </div>
      </header>

      <main id="ls-main" class="ls-main" tabindex="-1">
        <div id="ls-view" class="ls-view" aria-live="polite"></div>
      </main>
    </div>

    <nav class="ls-mobile-nav" aria-label="Mobile">
      <button type="button" class="ls-mobile-nav__item" data-nav="home"><span data-icon="home"></span><span>Home</span></button>
      <button type="button" class="ls-mobile-nav__item" data-nav="create"><span data-icon="create"></span><span>Create</span></button>
      <button type="button" class="ls-mobile-nav__item" data-nav="projects"><span data-icon="projects"></span><span>Projects</span></button>
      <button type="button" class="ls-mobile-nav__item" data-nav="queue"><span data-icon="queue"></span><span>Queue</span></button>
      <button type="button" class="ls-mobile-nav__item" data-nav="system"><span data-icon="system"></span><span>System</span></button>
    </nav>
  </div>

  <div id="ls-toasts" class="ls-toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="ls-cmd" class="ls-cmd" hidden></div>
  <div id="ls-overlay" class="ls-overlay" hidden></div>

  <script type="module" src="/dashboard/assets/js/main.js"></script>
</body>
</html>
