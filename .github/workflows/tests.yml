name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The trading stack imports with no third-party packages. This step
      # fails if that ever stops being true, because a dependency added
      # silently is a dependency nobody audited.
      - name: No third-party imports in the trading stack
        run: python -c "import earner.trading.live, earner.trading.engine, earner.trading.orders"

      - run: pip install pytest pyflakes cryptography
      # Video gateway tests need FastAPI and related optional deps + ffmpeg for QC.
      - name: Install video gateway test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e ".[dev,video]"
      # Scoped to the trading stack and its tests; the older earner/ package
      # predates this work and is linted separately.
      - run: python -m pyflakes earner/trading/ tests/test_{trading,strategy,engine,orders,live,backtest,research}.py
      # GATEWAY_QC_SKIP_OPENCV avoids OpenCV native aborts on interpreter shutdown
      # after video job threads complete (all tests may still pass before exit 134).
      - run: GATEWAY_QC_SKIP_OPENCV=1 python -m pytest -q
      # Explicit zero-exit guard: pytest can print "passed" then abort in C++ teardown.
      - name: Confirm pytest process exited cleanly
        run: echo "pytest completed without abort"

      # A secret reaching git is not recoverable by deleting it later.
      - name: Secret scan
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|\.pem$|\.key$|credentials|secrets\.json'; then
            echo "::error::a credential-shaped file is tracked"; exit 1
          fi
          # Require a plausible key body — placeholders like sk-ant-... in docs must not fail CI.
          if git grep -nIE '(sk-ant-[A-Za-z0-9_-]{12,}|sk_live_[A-Za-z0-9_-]{12,}|AKIA[0-9A-Z]{16})' -- . ':!*.example' ':!docs/*'; then
            echo "::error::a live-looking key is committed"; exit 1
          fi
          echo "clean"
